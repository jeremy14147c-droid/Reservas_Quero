{% extends "base.html" %}

{% block titulo %}No Autorizado (401){% endblock %}

{% block contenido %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <i class="bi bi-lock text-warning display-1 mb-3 d-block"></i>
        <h1 class="fw-bold">401 - No Autorizado</h1>
        <p class="lead text-muted">Debes iniciar sesión con una cuenta válida para ingresar.</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-warning mt-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
        </a>
    </div>
</div>
{% endblock %}
